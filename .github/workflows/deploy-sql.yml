name: Deploy Sports Analytics SQL Database

on:
  push:
    branches: [main]
    paths:
      - 'sportsanalytics/db/sportsanalytics/**'
      - '.github/workflows/deploy-sql.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SqlPackage
        run: dotnet tool install --global microsoft.sqlpackage

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
          path: './sportsanalytics/db/sportsanalytics/sportsanalytics.sqlproj'
          action: 'publish'
          build-arguments: '-c Release'
          skip-firewall-check: true
